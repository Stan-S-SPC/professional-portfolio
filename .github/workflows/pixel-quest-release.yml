name: Pixel Quest — release

# Publier une version : créer un release GitHub avec un tag X.Y.Z, ou `git tag X.Y.Z && git push origin X.Y.Z`.
# Le numéro doit être celui de pixel-quest/manifest.json. Le workflow construit le plugin et joint
# main.js, manifest.json et styles.css au release (en le créant s'il n'existe pas) : ces fichiers
# permettent l'installation via BRAT. Il peut aussi être lancé à la main (Actions → Run workflow)
# pour joindre les fichiers à un release déjà publié.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag du release auquel joindre les fichiers (ex. 0.1.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: pixel-quest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pixel-quest/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Vérifier que le tag correspond à la version du manifeste
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "${TAG}" ]; then
            echo "Le tag (${TAG}) ne correspond pas à la version du manifeste ($VERSION)."
            exit 1
          fi
      - name: Vérifier que le build versionné (dist/) correspond aux sources
        run: git diff --exit-code -- dist
      - name: Joindre les fichiers au release (le créer s'il n'existe pas)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/main.js dist/manifest.json dist/styles.css --clobber
          else
            gh release create "${TAG}" dist/main.js dist/manifest.json dist/styles.css \
              --title "Pixel Quest ${TAG}" \
              --notes "Plugin Obsidian Pixel Quest ${TAG}. Installation : voir pixel-quest/README.md (à la main ou via BRAT)."
          fi
