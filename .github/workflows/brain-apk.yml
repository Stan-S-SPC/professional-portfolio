name: Brain — APK

# Construit l'APK de debug de Brain et le publie en artefact téléchargeable
# (Actions → exécution → Artifacts → brain-debug-apk). Lance aussi les tests unitaires.
on:
  push:
    branches: ["**"]
    paths:
      - "brain/**"
      - ".github/workflows/brain-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Tests unitaires
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: APK de debug
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: brain-debug-apk
          path: brain/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
